[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "x2camf"
version = "1.0.0"
description = "Atomic mean-field spin-orbit integrals for X2C Hamiltonians (C99 implementation, ctypes binding)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["numpy"]
authors = [{ name = "Chaoqun Zhang" }, { name = "Xubo Wang" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
pyscf = ["pyscf"]

[project.urls]
Repository = "https://github.com/xubwa/x2camf-c"
"C++ X2CAMF" = "https://github.com/Warlocat/x2camf"

[tool.scikit-build]
# the library is loaded through ctypes: one wheel per platform, any Python 3
wheel.py-api = "py3"
wheel.packages = ["python/x2camf"]
cmake.build-type = "Release"
sdist.exclude = ["build", ".github"]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
test-requires = ["numpy"]
# run from cibuildwheel's empty cwd: test_smoke.py puts ../python (the source
# tree, no compiled library) first on sys.path, which would shadow the wheel
test-command = "cp {project}/tests/test_smoke.py . && python test_smoke.py"

[tool.cibuildwheel.linux]
# manylinux_2_28 (AlmaLinux 8, glibc >= 2.28): numpy >= 2.3 has no older wheels
# either; openblas-devel lives in the powertools repository there
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "dnf install -y --enablerepo=powertools openblas-devel"
environment = { CMAKE_ARGS = "-DBLA_VENDOR=OpenBLAS" }

[tool.cibuildwheel.macos]
# Accelerate provides BLAS/LAPACK; OpenMP from Homebrew libomp
before-all = "brew install libomp"
# Homebrew's libomp is built for the runner's macOS (14): delocate refuses to
# bundle it into a wheel that claims an older deployment target
environment = { CMAKE_ARGS = "-DBLA_VENDOR=Apple -DOpenMP_ROOT=$(brew --prefix libomp)", MACOSX_DEPLOYMENT_TARGET = "14.0" }
